name: CI/CD

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout dépot
        uses: actions/checkout@v3

      - name: Installer Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Creer fichier .env
        run: |
          echo "MYSQL_HOST=mysql" >> .env
          echo "REDIS_HOST =redis" >> .env
          echo "REDIS_PORT=6379" >> .env
          echo "REDIS_DB=0" >> .env
          echo "DB_NAME=labo02_db" >> .env
          echo "DB_USERNAME=labo02" >> .env
          echo "DB_PASSWORD=labo02" >> .env

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Demarrer le conteneur de test
        run: docker compose up -d



      - name: Lancer les Tests
        working-directory: src
        run: | 
          python -m pytest

      - name: Deploiment sur la VM
        uses: appleboy/ssh-action@v0.1.6
        with: 
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd log430-a25-labo2
            git pull origin main
            source venv/bin/activate || python3 -m venv venv && source venv/bin/activate
            pip install -r requirements.txt
            sudo systemctl restart store_manager.py


